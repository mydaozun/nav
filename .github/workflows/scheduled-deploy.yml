name: Scheduled Deploy

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.local file
        run: |
          echo "=== 检查 Secrets ==="
          if [ -n "${{ secrets.NOTION_API_KEY }}" ]; then echo "NOTION_API_KEY: ✓ 已设置"; else echo "NOTION_API_KEY: ✗ 未设置"; fi
          if [ -n "${{ secrets.NOTION_DATABASE_ID }}" ]; then echo "NOTION_DATABASE_ID: ✓ 已设置"; else echo "NOTION_DATABASE_ID: ✗ 未设置"; fi
          if [ -n "${{ secrets.NOTION_CONFIG_DATABASE_ID }}" ]; then echo "NOTION_CONFIG_DATABASE_ID: ✓ 已设置"; else echo "NOTION_CONFIG_DATABASE_ID: ✗ 未设置"; fi
          if [ -n "${{ secrets.NOTION_WEBSITE_CONFIG_ID }}" ]; then echo "NOTION_WEBSITE_CONFIG_ID: ✓ 已设置"; else echo "NOTION_WEBSITE_CONFIG_ID: ✗ 未设置"; fi
          echo "=== 创建 .env.local ==="
          echo "NOTION_API_KEY=${{ secrets.NOTION_API_KEY }}" >> .env.local
          echo "NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}" >> .env.local
          echo "NOTION_CONFIG_DATABASE_ID=${{ secrets.NOTION_CONFIG_DATABASE_ID }}" >> .env.local
          echo "NOTION_WEBSITE_CONFIG_ID=${{ secrets.NOTION_WEBSITE_CONFIG_ID }}" >> .env.local
          echo "=== .env.local 内容 ==="
          cat .env.local | sed 's/NOTION_API_KEY=.*/NOTION_API_KEY=***/g'

      - name: Sync data from Notion
        run: |
          echo "=== 开始同步 Notion 数据 ==="
          pnpm sync:notion
          echo "=== 检查 webnav.js ==="
          ls -la src/data/
          cat src/data/webnav.js | head -50

      - name: Sync to navLinks.js
        run: |
          echo "=== 开始同步到 navLinks.js ==="
          pnpm sync:navlinks
          echo "=== 检查 navLinks.js ==="
          cat src/data/navLinks.js | head -50

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for content changes
        id: check_changes
        run: |
          git add src/data/webnav.js src/data/navLinks.js
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git commit -m "chore: auto-update data from Notion"
          git push

      - name: Set up deploy hook
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          echo "VERCEL_DEPLOY_HOOK=${{ secrets.VERCEL_DEPLOY_HOOK }}" >> $GITHUB_ENV

      - name: Trigger Vercel Deploy
        if: steps.check_changes.outputs.changes == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: |
          curl -X POST ${{ env.VERCEL_DEPLOY_HOOK }}
